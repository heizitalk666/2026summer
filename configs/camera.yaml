# 相机与光学。方案书 §3.4 / §4.1.3 / §5.3。
camera:
  width: 1920
  height: 1080
  fps: 30
  pixel_format: BGR888

optics:
  # 广角端水平视场角，像素密度公式里的 θ。
  #
  # 差异清单 C5：方案书 §3.4 选型表写 60°，但 §4.1.3 由 f=4 mm / w=5.37 mm
  # 自算出 67°。两处对不上。暂按 60° 冻结（两份文档现状一致），并在标定时
  # 用 tools/calibrate.py 实测修正。实测与 60° 偏差超过 3° 时，d_max 与路线
  # 标定规范必须按实测值重算并通报全组。
  hfov_at_1x_deg: 60.0
  hfov_tolerance_deg: 3.0
  max_zoom: 3.0             # 光学变焦。数字变焦不增加感光像素，p 公式对它不成立
  zoom_is_optical: true
  # 由 0.5 % FS 精度指标反推（方案书 §5.3.2）：
  #   √2·arctan(1/r) ≤ 0.5 % × 270° = 1.35°  →  r ≥ 60 px  →  p_min = 120 px
  pixel_density_min_px: 120.0
  # 由判据反推的观测距离上限（方案书 §5.3.3）
  max_observe_distance_m: 6.0

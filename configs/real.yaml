# 真机参数。**只在 driver_mode: real 时才有意义**，桩模式整段不读。
#
# 硬件还没到，这里的端口名与限值都是按 docs/底盘串口协议.md v0.1 预填的草案。
# 到货后要改的就是这几行——上位机代码一行不用动，这正是 ICD §8.7 那个
# "唯一分支点"设计要换来的东西。
#
# 先用假小车联调：
#   python -m patrol.tools.fakecar --pty      # 打印出 /dev/pts/N
#   把下面的 chassis.port 换成它，再把 system.yaml 的 driver_mode 改成 real
real:
  serial:
    chassis:
      port: /dev/ttyUSB0        # 假小车联调时换成 fakecar 打印的 /dev/pts/N
      baudrate: 115200          # 8N1，无流控
      read_timeout_s: 0.05
      # 上位机 ≥1 Hz 发 PNG；底盘 3 s 收不到就自行减速停车。
      # 这是**底盘侧**的独立保护，与网关看门狗是两回事：网关看门狗管
      # "AI 进程死了"，保活管"串口断了或整个 RK3576 死了"——后者网关
      # 自己也救不了，只能由底盘兜底。两级都要有。
      ping_period_s: 0.5
      keepalive_s: 3.0
      # 状态帧超过这个时长没来就报 FAULT。上位机据此判断"车停稳了"，
      # 拿过期数据会在车还在动的时候开始变焦抓拍。
      status_timeout_s: 1.0
      supports_task_level: true # 为 false 时 mission 拒绝启动（ICD §8.2）
      has_safety_layer: true
      max_speed_mps: 1.0
      max_creep_m: 0.5          # 硬件上限。网关那道 0.5 m 是任务级限值，两道独立
    ptz:
      # 云台多半会随整机附一套厂商协议（Pelco-D / VISCA / 私有）。
      # 到货后只需换掉 ptz_serial.py 里的 _encode_*，语义层不用动。
      port: /dev/ttyUSB1
      baudrate: 115200
      read_timeout_s: 0.05
      status_timeout_s: 1.0
      pan_range_deg: [-170.0, 170.0]
      tilt_range_deg: [-30.0, 60.0]
      # **max_zoom < 3.0 或 zoom_is_optical: false 时系统拒绝启动。**
      # 数字变焦不增加感光像素，像素密度公式对它不成立——这条把
      # "5 m 处 15 cm 表盘要 3× 变焦才够 120 px"从纸面结论变成了开机检查。
      max_zoom: 3.0
      zoom_is_optical: true
      max_pan_dps: 60.0         # 为 0 时 mission 自动退回 servo.mode=open_loop
      max_tilt_dps: 40.0
  camera:
    device: 0                   # /dev/video0；RK3576 上最终换 MPP 硬解
    fourcc: MJPG                # YUYV 在 1080p 下多数 UVC 相机只能 5 fps
    max_fps: 30
    grab_timeout_s: 0.5
  localizer:
    # 定位来自底盘的 SLAM/里程计，经同一条串口上来，不是独立设备。
    # 底盘只报 progress 时退化为按路线插值，此时 valid=false，
    # 触发 POSE_INVALID 抑制——宁可不复核，也不在漂移的坐标系里下发 GOTO。
    rate_hz: 20.0
    cov_trace_nominal: 0.014
    cov_trace_odom: 0.35
